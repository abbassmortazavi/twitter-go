version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: postgress
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=twitter_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - twitter
    volumes:
      - data:/var/lib/postgresql

volumes:
  data:

networks:
  twitter:
    driver: bridge